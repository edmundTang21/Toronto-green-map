<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Toronto Precipitation 1991–2025</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
  #sidebar { width: 260px; min-width: 260px; background: #fff; padding: 24px 20px; overflow-y: auto; border-right: 1px solid #e0e0e0; }
  #sidebar h2 { font-size: 15px; font-weight: 700; margin-bottom: 4px; color: #111; }
  #sidebar p.sub { font-size: 11px; color: #888; margin-bottom: 20px; line-height: 1.5; }
  .section { margin-bottom: 20px; }
  .section label.head { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #555; margin-bottom: 8px; }
  .radio-group { display: flex; flex-direction: column; gap: 6px; }
  .radio-group label { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #333; cursor: pointer; }
  .radio-group input { accent-color: #4a90d9; }
  .slider-row { margin-bottom: 12px; }
  .slider-row .lbl { display: flex; justify-content: space-between; font-size: 12px; color: #444; margin-bottom: 4px; }
  .slider-row input[type=range] { width: 100%; accent-color: #4a90d9; }
  #main { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .dl-btn { display: inline-block; margin-top: 16px; padding: 7px 14px; background: #4a90d9; color: #fff; border: none; border-radius: 5px; font-size: 12px; cursor: pointer; width: 100%; }
  .dl-btn:hover { background: #357abd; }
</style>
</head>
<body>
<div id="sidebar">
  <h2>Toronto Precipitation</h2>
  <p class="sub">Avg daily rain &amp; snow<br>1991–2025 · Feb 29 excluded</p>

  <div class="section">
    <label class="head">Rain metric</label>
    <div class="radio-group">
      <label><input type="radio" name="metric" value="rain_mean_all" checked> Average incl. dry days</label>
      <label><input type="radio" name="metric" value="rain_mean_wet"> Average (rainy days only)</label>
      <label><input type="radio" name="metric" value="rain_freq"> Frequency (% rainy days)</label>
    </div>
  </div>

  <div class="section">
    <label class="head">Label by</label>
    <div class="radio-group">
      <label><input type="radio" name="label" value="month"> Month (365 bars)</label>
      <label><input type="radio" name="label" value="week" checked> Week (52 bars)</label>
    </div>
  </div>

  <div class="section">
    <label class="head">Rain indicator position</label>
    <div class="radio-group">
      <label><input type="radio" name="rain-indicator" value="top" checked> Top</label>
      <label><input type="radio" name="rain-indicator" value="bottom"> Bottom</label>
    </div>
  </div>

  <div class="section">
    <label class="head">Snow indicator position</label>
    <div class="radio-group">
      <label><input type="radio" name="snow-indicator" value="top" checked> Top</label>
      <label><input type="radio" name="snow-indicator" value="bottom"> Bottom</label>
    </div>
  </div>

  <div class="section">
    <label class="head">Visual controls</label>
    <div class="slider-row">
      <div class="lbl"><span>Centre radius</span><span id="v-centre">80</span></div>
      <input type="range" id="s-centre" min="5" max="80" value="80">
    </div>
    <div class="slider-row">
      <div class="lbl"><span>Snow ring depth</span><span id="v-snow">20</span></div>
      <input type="range" id="s-snow" min="5" max="40" value="20">
    </div>
    <div class="slider-row">
      <div class="lbl"><span>Ring gap</span><span id="v-gap">4</span></div>
      <input type="range" id="s-gap" min="1" max="15" value="4">
    </div>
    <div class="slider-row">
      <div class="lbl"><span>Rain ring depth</span><span id="v-rain">31</span></div>
      <input type="range" id="s-rain" min="10" max="60" value="31">
    </div>
    <div class="slider-row">
      <div class="lbl"><span>Bar width</span><span id="v-barw">0.20</span></div>
      <input type="range" id="s-barw" min="20" max="100" value="20">
    </div>
    <div class="slider-row">
      <div class="lbl"><span>Indicator font size</span><span id="v-indsize">2.3</span></div>
      <input type="range" id="s-indsize" min="10" max="60" value="23">
    </div>
    <div class="slider-row">
      <div class="lbl"><span>Monthly line width</span><span id="v-lw">0.8</span></div>
      <input type="range" id="s-lw" min="1" max="30" value="8">
    </div>
  </div>

  <div class="section">
    <label class="head">Legend</label>
    <div style="display:flex;flex-direction:column;gap:6px;">
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:14px;height:14px;background:#B6E5E8;border-radius:2px;flex-shrink:0;"></div>
        <span style="font-size:12.5px;color:#333;">Rain (outer ring)</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div style="width:14px;height:14px;background:#76659E;border-radius:2px;flex-shrink:0;"></div>
        <span style="font-size:12.5px;color:#333;">Snow (inner ring)</span>
      </div>
    </div>
  </div>

  <button class="dl-btn" id="dl-svg">Download SVG</button>
</div>

<div id="main">
  <svg id="chart"></svg>
</div>

const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const RAIN_COLOR = "#B6E5E8";
const SNOW_COLOR = "#76659E";
const BG = "#FFFFFF";

// Pre-compute weekly averages (52 weeks, week 53 merged into 52)
const WEEKLY_DATA = (function() {
  const map = {};
  DATA.forEach(d => {
    const w = d.week > 52 ? 52 : d.week;
    if (!map[w]) map[w] = [];
    map[w].push(d);
  });
  return Array.from({length: 52}, (_, i) => {
    const w = i + 1;
    const days = map[w] || [];
    const sum = key => days.reduce((s, d) => s + d[key], 0);
    const avg = key => sum(key) / days.length;
    return {
      week: w,
      rain_mean_all: sum("rain_mean_all"),
      rain_mean_wet: sum("rain_mean_wet"),
      rain_freq:     avg("rain_freq"),   // frequency stays as avg (probability)
      snowfall_cm:   sum("snowfall_cm"),
    };
  });
})();

let state = {
  metric: "rain_mean_all",
  labelBy: "week",
  rainIndicator: "top",
  snowIndicator: "top",
  indicatorSize: 2.3,
  lineWidth: 0.8,
  centreR: 80,
  snowDepth: 20,
  gap: 4,
  rainDepth: 31,
  barWFrac: 0.20,
};

function draw() {
  const svg = d3.select("#chart");
  svg.selectAll("*").remove();

  const W = document.getElementById("main").clientWidth;
  const H = document.getElementById("main").clientHeight;
  const size = Math.min(W, H) * 0.96;
  svg.attr("width", size).attr("height", size)
     .attr("viewBox", `0 0 ${size} ${size}`)
     .style("background", BG);

  const cx = size / 2, cy = size / 2;
  const g = svg.append("g")
    .attr("transform", `translate(${cx},${cy})`)
    .attr("font-family", "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif");

  const isWeek = state.labelBy === "week";
  const displayData = isWeek ? WEEKLY_DATA : DATA;
  const N = displayData.length;

  const centreR  = state.centreR;
  const snowDepth = state.snowDepth;
  const gap      = state.gap;
  const rainDepth = state.rainDepth;
  const barWFrac = state.barWFrac;

  const rainVals = displayData.map(d => d[state.metric]);
  const snowVals = displayData.map(d => d.snowfall_cm);
  const RAIN_MAX = d3.max(rainVals);
  const SNOW_MAX = d3.max(snowVals);

  const SNOW_INNER = centreR;
  const RAIN_INNER = centreR + snowDepth + gap;
  const barW = (2 * Math.PI / N) * barWFrac;

  const outerR = RAIN_INNER + rainDepth + 18;
  const scale  = (size / 2 - 4) / (outerR + 14);
  const px = v => v * scale;

  const angle = i => (i / N) * 2 * Math.PI;
  // bar width in px at the inner edge of each ring (gives uniform rect width)
  const rainBarW = barW * px(RAIN_INNER);
  const snowBarW = barW * px(SNOW_INNER + snowDepth);

  // draw a rectangular bar: rotated rect anchored at the circle center
  function rectBar(a, innerR, outerR, wPx, color) {
    const rot = a * 180 / Math.PI;
    g.append("rect")
      .attr("x", -wPx / 2)
      .attr("y", -px(outerR))
      .attr("width", wPx)
      .attr("height", px(outerR - innerR))
      .attr("transform", `rotate(${rot})`)
      .attr("fill", color)
      .attr("opacity", 0.9);
  }

  // --- grid rings ---
  let gridVals, gridFmt;
  if (state.metric === "rain_freq") {
    gridVals = [0.2,0.4,0.6,0.8]; gridFmt = v => (v*100|0) + "%";
  } else {
    gridVals = [1,2,3,4,5]; gridFmt = v => v + "mm";
  }

  const indFS = state.indicatorSize;
  const rainLabelY = r => state.rainIndicator === "top" ? -r - 2 : r + px(indFS);
  const snowLabelY = r => state.snowIndicator === "top" ? -r - 2 : r + px(indFS);

  gridVals.forEach(rv => {
    const r = px(RAIN_INNER + (rv / RAIN_MAX) * rainDepth);
    g.append("circle").attr("r",r).attr("fill","none").attr("stroke","#00000012").attr("stroke-width",0.8);
    g.append("text").attr("x",2).attr("y",rainLabelY(r))
      .attr("font-size",px(indFS)).attr("fill","#00000066").text(gridFmt(rv));
  });

  // --- snow grid rings ---
  const snowSteps = [0.5,1,2,5,10,15,20,25,30,50];
  const snowStep = snowSteps.find(s => SNOW_MAX / s <= 4) || snowSteps[snowSteps.length-1];
  const snowGridVals = [];
  for (let v = snowStep; v < SNOW_MAX; v += snowStep) snowGridVals.push(Math.round(v*10)/10);

  snowGridVals.forEach(sv => {
    const r = px(SNOW_INNER + snowDepth - (sv / SNOW_MAX) * snowDepth);
    g.append("circle").attr("r",r).attr("fill","none").attr("stroke","#76659E22").attr("stroke-width",0.8);
    g.append("text").attr("x",2).attr("y",snowLabelY(r))
      .attr("font-size",px(indFS)).attr("fill","#76659E88").text(sv + "cm");
  });

  // --- separator ring ---
  g.append("circle").attr("r",px(RAIN_INNER-1))
    .attr("fill","none").attr("stroke","#00000030")
    .attr("stroke-width",0.8).attr("stroke-dasharray","3,3");

  // --- rain bars ---
  displayData.forEach((d, i) => {
    const val = rainVals[i];
    if (val <= 0) return;
    const h = (val / RAIN_MAX) * rainDepth;
    rectBar(angle(i), RAIN_INNER, RAIN_INNER + h, rainBarW, RAIN_COLOR);
  });

  // --- snow bars (inward) ---
  displayData.forEach((d, i) => {
    const val = snowVals[i];
    if (val <= 0) return;
    const h = (val / SNOW_MAX) * snowDepth;
    const top = SNOW_INNER + snowDepth;
    rectBar(angle(i), top - h, top, snowBarW, SNOW_COLOR);
  });

  // --- monthly average lines (daily/month mode only) ---
  if (!isWeek) {
    const mRain = {}, mSnow = {};
    DATA.forEach(d => {
      mRain[d.month] = (mRain[d.month] || 0) + d[state.metric];
      mSnow[d.month] = (mSnow[d.month] || 0) + d.snowfall_cm;
    });
    const mRainMax = Math.max(...Object.values(mRain));
    const mSnowMax = Math.max(...Object.values(mSnow));

    function makeRoundedPath(radiusFn) {
      const pts = DATA.map((d, i) => {
        const r = radiusFn(d.month);
        const a = angle(i);
        return [Math.sin(a) * r, -Math.cos(a) * r];
      });
      return "M" + pts.map(p => `${p[0]},${p[1]}`).join("L") + "Z";
    }

    g.append("path")
      .attr("d", makeRoundedPath(m => px(RAIN_INNER + (mRain[m] / mRainMax) * rainDepth)))
      .attr("fill","none").attr("stroke","#2A7A8A")
      .attr("stroke-width", px(state.lineWidth));

    g.append("path")
      .attr("d", makeRoundedPath(m => px(SNOW_INNER + snowDepth - (mSnow[m] / mSnowMax) * snowDepth)))
      .attr("fill","none").attr("stroke","#3A2A6E")
      .attr("stroke-width", px(state.lineWidth));
  }

  // --- labels & dividers ---
  if (isWeek) {
    // One label every 4 weeks, divider every 4 weeks
    const labelR = RAIN_INNER + rainDepth + 10;
    displayData.forEach((d, i) => {
      const w = d.week;
      if (w % 4 !== 1) return;
      const a = angle(i);
      g.append("line")
        .attr("x1", Math.sin(a) * px(RAIN_INNER))
        .attr("y1", -Math.cos(a) * px(RAIN_INNER))
        .attr("x2", Math.sin(a) * px(RAIN_INNER + rainDepth + 2))
        .attr("y2", -Math.cos(a) * px(RAIN_INNER + rainDepth + 2))
        .attr("stroke","#00000025").attr("stroke-width",0.7);
      const lx = Math.sin(a) * px(labelR);
      const ly = -Math.cos(a) * px(labelR);
      const deg = (a * 180 / Math.PI) % 360;
      const rot = (deg > 90 && deg < 270) ? deg + 180 : deg;
      g.append("text")
        .attr("x",lx).attr("y",ly)
        .attr("text-anchor","middle").attr("dominant-baseline","middle")
        .attr("font-size",px(5)).attr("font-weight","700").attr("fill","#222")
        .attr("transform",`rotate(${rot},${lx},${ly})`)
        .text("W" + w);
    });
  } else {
    // Month labels — group daily data by month
    const monthMap = {};
    DATA.forEach((d, i) => {
      const m = d.month;
      if (!monthMap[m]) monthMap[m] = [];
      monthMap[m].push(i);
    });
    const labelR = RAIN_INNER + rainDepth + 10;
    for (let m = 1; m <= 12; m++) {
      const indices = monthMap[m];
      if (!indices) continue;
      const firstIdx = indices[0];
      const midIdx   = indices[Math.floor(indices.length / 2)];
      const a  = angle(midIdx);
      const fa = angle(firstIdx);
      g.append("line")
        .attr("x1", Math.sin(fa) * px(RAIN_INNER))
        .attr("y1", -Math.cos(fa) * px(RAIN_INNER))
        .attr("x2", Math.sin(fa) * px(RAIN_INNER + rainDepth + 2))
        .attr("y2", -Math.cos(fa) * px(RAIN_INNER + rainDepth + 2))
        .attr("stroke","#00000025").attr("stroke-width",0.7);
      const lx = Math.sin(a) * px(labelR);
      const ly = -Math.cos(a) * px(labelR);
      const deg = (a * 180 / Math.PI) % 360;
      const rot = (deg > 90 && deg < 270) ? deg + 180 : deg;
      g.append("text")
        .attr("x",lx).attr("y",ly)
        .attr("text-anchor","middle").attr("dominant-baseline","middle")
        .attr("font-size",px(6)).attr("font-weight","700").attr("fill","#222")
        .attr("transform",`rotate(${rot},${lx},${ly})`)
        .text(MONTH_NAMES[m - 1]);
    }
  }

  // --- centre circle ---
  g.append("circle").attr("r",px(centreR-0.5)).attr("fill",BG).attr("stroke","#00000020").attr("stroke-width",1.2);
  g.append("text").attr("text-anchor","middle").attr("dominant-baseline","middle")
    .attr("font-size",px(5.5)).attr("font-weight","700").attr("fill","#222")
    .attr("dy","-0.6em").text("Toronto");
  g.append("text").attr("text-anchor","middle").attr("dominant-baseline","middle")
    .attr("font-size",px(4.5)).attr("fill","#444")
    .attr("dy","0.6em").text("1991–2025");

}

// --- controls ---
document.querySelectorAll("input[name=metric]").forEach(el =>
  el.addEventListener("change", () => { state.metric = el.value; draw(); }));
document.querySelectorAll("input[name=label]").forEach(el =>
  el.addEventListener("change", () => { state.labelBy = el.value; draw(); }));
document.querySelectorAll("input[name=rain-indicator]").forEach(el =>
  el.addEventListener("change", () => { state.rainIndicator = el.value; draw(); }));
document.querySelectorAll("input[name=snow-indicator]").forEach(el =>
  el.addEventListener("change", () => { state.snowIndicator = el.value; draw(); }));

[
  ["s-centre","v-centre","centreR",  v => v],
  ["s-snow",  "v-snow",  "snowDepth",v => v],
  ["s-gap",   "v-gap",   "gap",      v => v],
  ["s-rain",  "v-rain",  "rainDepth",v => v],
  ["s-barw",  "v-barw",  "barWFrac",    v => (v/100).toFixed(2)],
  ["s-indsize","v-indsize","indicatorSize", v => (v/10).toFixed(1)],
  ["s-lw",     "v-lw",     "lineWidth",     v => (v/10).toFixed(1)],
].forEach(([id, vid, key, fmt]) => {
  const el = document.getElementById(id);
  el.addEventListener("input", () => {
    const val = +el.value;
    document.getElementById(vid).textContent = fmt(val);
    state[key] = (key === "barWFrac") ? val / 100 : (key === "indicatorSize" || key === "lineWidth") ? val / 10 : val;
    draw();
  });
});

document.getElementById("dl-svg").addEventListener("click", () => {
  const orig = document.getElementById("chart");
  const w = orig.getAttribute("width");
  const h = orig.getAttribute("height");
  const clone = orig.cloneNode(true);

  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  clone.setAttribute("width", w);
  clone.setAttribute("height", h);
  clone.setAttribute("viewBox", `0 0 ${w} ${h}`);
  clone.removeAttribute("style");

  // embed font style so text renders correctly outside the browser
  const style = document.createElementNS("http://www.w3.org/2000/svg", "style");
  style.textContent = "text { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; }";
  clone.insertBefore(style, clone.firstChild);

  // white background rect
  const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  bg.setAttribute("width", w);
  bg.setAttribute("height", h);
  bg.setAttribute("fill", "#ffffff");
  clone.insertBefore(bg, style.nextSibling);

  const xml = new XMLSerializer().serializeToString(clone);
  const blob = new Blob(['<?xml version="1.0" encoding="utf-8"?>\n' + xml], {type:"image/svg+xml"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "toronto_precipitation.svg";
  a.click();
  URL.revokeObjectURL(a.href);
});

window.addEventListener("resize", draw);
draw();
</script>
</body>
