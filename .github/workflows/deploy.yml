name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to 167.172.139.126
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 167.172.139.126
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Ensure Node.js is available (handles nvm or system installs)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            export PATH="$PATH:/usr/local/bin:/usr/bin"

            DEPLOY_DIR=/var/www/green-map
            REPO_URL=https://github.com/edmundTang21/Toronto-green-map.git

            if [ -d "$DEPLOY_DIR/.git" ]; then
              echo "Repo exists, pulling latest changes..."
              cd "$DEPLOY_DIR"
              git pull origin main
            else
              echo "Repo not found, cloning fresh..."
              rm -rf "$DEPLOY_DIR"
              git clone "$REPO_URL" "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            fi

            echo "Rebuilding frontend..."
            cd "$DEPLOY_DIR/frontend"
            npm ci
            npm run build
            cd ..

            echo "Restarting backend with PM2..."
            if pm2 describe green-map-backend > /dev/null 2>&1; then
              pm2 restart green-map-backend
            else
              pm2 start backend/index.js --name green-map-backend
            fi

            pm2 save

            echo "Deployment complete."
