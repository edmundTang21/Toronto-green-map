name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to 167.172.139.126
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 167.172.139.126
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Ensure Node.js and global npm bins (pm2) are available
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            export PATH="$PATH:/usr/local/bin:/usr/bin"
            # Add all nvm node version bin dirs to PATH (covers pm2 global install)
            for d in "$NVM_DIR"/versions/node/*/bin; do export PATH="$PATH:$d"; done
            # Install pm2 globally if still not found
            if ! command -v pm2 &>/dev/null; then
              echo "pm2 not found, installing..."
              npm install -g pm2
            fi

            DEPLOY_DIR=/var/www/green-map
            REPO_URL=https://github.com/edmundTang21/Toronto-green-map.git

            git config --global --add safe.directory "$DEPLOY_DIR"

            if [ -d "$DEPLOY_DIR/.git" ]; then
              echo "Repo exists, pulling latest changes..."
              cd "$DEPLOY_DIR"
              git pull origin main
            else
              echo "Repo not found, cloning fresh..."
              rm -rf "$DEPLOY_DIR"
              git clone "$REPO_URL" "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            fi

            echo "Installing backend dependencies..."
            cd "$DEPLOY_DIR/backend"
            npm ci
            cd ..

            echo "Rebuilding frontend..."
            cd "$DEPLOY_DIR/frontend"
            npm ci
            VITE_MAPBOX_TOKEN=${{ secrets.VITE_MAPBOX_TOKEN }} VITE_BASE_PATH=/map/ VITE_API_URL=/map npm run build
            cd ..

            echo "Restarting backend with PM2..."
            if pm2 describe green-map-backend > /dev/null 2>&1; then
              pm2 restart green-map-backend
            else
              pm2 start backend/index.js --name green-map-backend
            fi

            pm2 save

            echo "Deployment complete."
